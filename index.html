<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎭 חידון פורים | Purim Quiz 🎭</title>
  <style>
    /* ===== CSS Variables & Reset ===== */
    :root {
      --primary:   #FF6B35;
      --secondary: #FFD700;
      --accent:    #7B2FBE;
      --success:   #2ECC71;
      --error:     #E74C3C;
      --bg:        #FFF5E6;
      --card:      #FFFFFF;
      --text:      #2C2C2C;
      --radius:    20px;
      --shadow:    0 8px 30px rgba(0,0,0,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', 'Arial Rounded MT Bold', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== Animated background ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(255,107,53,0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(123,47,190,0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255,215,0,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== Layout ===== */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 680px;
      animation: fadeIn 0.4s ease;
    }
    .screen.active { display: flex; flex-direction: column; align-items: center; gap: 20px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Card ===== */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 32px;
      width: 100%;
    }

    /* ===== Typography ===== */
    h1 { font-size: clamp(2rem, 6vw, 3rem); text-align: center; line-height: 1.2; }
    h2 { font-size: clamp(1.4rem, 4vw, 1.9rem); text-align: center; }
    h3 { font-size: clamp(1.1rem, 3vw, 1.4rem); }
    p  { font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.6; }
    .emoji-big { font-size: clamp(3rem, 10vw, 5rem); }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 700;
      padding: 16px 28px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      min-height: 56px;
      min-width: 140px;
      white-space: nowrap;
    }
    .btn:hover  { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
    .btn:active { transform: translateY(0);    box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .btn:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

    .btn-primary   { background: var(--primary);   color: #fff; }
    .btn-secondary { background: var(--secondary); color: #333; }
    .btn-accent    { background: var(--accent);    color: #fff; }
    .btn-ghost     { background: transparent; border: 2px solid var(--primary); color: var(--primary); }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
    }

    /* ===== HOME SCREEN ===== */
    .home-title {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: clamp(2.4rem, 8vw, 4rem);
      text-align: center;
      margin-bottom: 4px;
    }
    .home-subtitle {
      text-align: center;
      color: #666;
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
    }
    .decorations {
      font-size: clamp(2rem, 6vw, 3.5rem);
      text-align: center;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    /* ===== Settings ===== */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 420px) { .settings-grid { grid-template-columns: 1fr; } }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .setting-label {
      font-weight: 700;
      font-size: 0.95rem;
      color: #555;
    }
    .setting-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toggle-btn {
      padding: 10px 18px;
      border-radius: 30px;
      border: 2px solid #ddd;
      background: #f7f7f7;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 44px;
    }
    .toggle-btn:hover { border-color: var(--primary); color: var(--primary); }
    .toggle-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .toggle-btn:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

    /* ===== QUIZ SCREEN ===== */
    .quiz-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .progress-text {
      font-size: 1rem;
      font-weight: 700;
      color: #555;
      white-space: nowrap;
    }
    .score-display {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 14px;
      background: #eee;
      border-radius: 7px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 7px;
      transition: width 0.4s ease;
    }

    .question-card {
      position: relative;
    }
    .question-number {
      font-size: 0.85rem;
      font-weight: 700;
      color: #999;
      margin-bottom: 8px;
    }
    .question-text {
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .read-aloud-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      padding: 4px 6px;
      border-radius: 8px;
      transition: background 0.2s;
      vertical-align: middle;
    }
    .read-aloud-btn:hover { background: #f0f0f0; }
    .read-aloud-btn:focus-visible { outline: 3px solid var(--accent); }

    /* ===== Answer Buttons ===== */
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
    }
    @media (max-width: 420px) { .answers-grid { grid-template-columns: 1fr; } }

    .answer-btn {
      background: #f8f4ff;
      border: 3px solid #ddd;
      border-radius: var(--radius);
      padding: 18px 14px;
      font-size: clamp(1rem, 2.8vw, 1.2rem);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #fff5f0;
      transform: scale(1.03);
      box-shadow: 0 4px 16px rgba(255,107,53,0.2);
    }
    .answer-btn:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; }
    .answer-btn:disabled { cursor: default; }
    .answer-btn.correct {
      border-color: var(--success);
      background: #e8faf0;
      color: #1a7a45;
      animation: popIn 0.3s ease;
    }
    .answer-btn.wrong {
      border-color: var(--error);
      background: #fde8e8;
      color: #922b21;
    }
    .answer-btn.revealed {
      border-color: var(--success);
      background: #e8faf0;
      color: #1a7a45;
    }

    @keyframes popIn {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* ===== Feedback ===== */
    .feedback-area {
      width: 100%;
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: clamp(1rem, 2.5vw, 1.1rem);
      font-weight: 600;
      display: none;
      align-items: flex-start;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }
    .feedback-area.show { display: flex; }
    .feedback-area.feedback-correct {
      background: #e8faf0;
      border: 2px solid var(--success);
      color: #1a7a45;
    }
    .feedback-area.feedback-wrong {
      background: #fde8e8;
      border: 2px solid var(--error);
      color: #922b21;
    }
    .feedback-area.feedback-info {
      background: #f0eaff;
      border: 2px solid var(--accent);
      color: #4a1a8a;
    }
    .feedback-icon { font-size: 1.6rem; flex-shrink: 0; }
    .feedback-text { flex: 1; line-height: 1.5; }

    .next-btn-wrap { width: 100%; display: flex; justify-content: center; }

    /* ===== Stars / Score ===== */
    .stars-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
    }

    /* ===== RESULTS SCREEN ===== */
    .result-score-text {
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .result-message {
      font-size: clamp(1rem, 3vw, 1.3rem);
      text-align: center;
      color: #555;
      line-height: 1.6;
    }

    /* ===== Confetti ===== */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* ===== Misc ===== */
    .divider {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e0d0f0, transparent);
    }
    .text-center { text-align: center; }
    .mt-8 { margin-top: 8px; }
    .lang-toggle-corner {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 200;
    }
    [dir="ltr"] .lang-toggle-corner { left: auto; right: 14px; }

    /* RTL / LTR switching */
    [dir="ltr"] { text-align: left; }
    [dir="ltr"] .home-title,
    [dir="ltr"] h2,
    [dir="ltr"] .home-subtitle,
    [dir="ltr"] .text-center { text-align: center; }
  </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<!-- Language Toggle (always visible) -->
<div class="lang-toggle-corner">
  <button class="toggle-btn active" id="lang-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
    🌐 EN
  </button>
</div>

<div id="app">
  <!-- ========== HOME SCREEN ========== -->
  <div id="screen-home" class="screen active" role="main">
    <div class="decorations" aria-hidden="true">🎭 🎪 🎉</div>
    <h1 class="home-title" id="home-title">חידון פורים 🎊</h1>
    <p class="home-subtitle" id="home-subtitle">משחק הטריוויה המהנה לפורים!</p>

    <div class="card" style="gap:20px;display:flex;flex-direction:column;">
      <div class="settings-grid">
        <!-- Difficulty -->
        <div class="setting-item">
          <span class="setting-label" id="label-difficulty">🎯 רמת קושי</span>
          <div class="setting-options" role="group" aria-labelledby="label-difficulty">
            <button class="toggle-btn active" id="diff-easy" onclick="setDifficulty('easy')" aria-pressed="true">
              😊 <span data-key="easy">קל</span>
            </button>
            <button class="toggle-btn" id="diff-medium" onclick="setDifficulty('medium')" aria-pressed="false">
              🤔 <span data-key="medium">בינוני</span>
            </button>
          </div>
        </div>

        <!-- Sound -->
        <div class="setting-item">
          <span class="setting-label" id="label-sound">🔊 צלילים</span>
          <div class="setting-options" role="group" aria-labelledby="label-sound">
            <button class="toggle-btn active" id="sound-on" onclick="setSound(true)" aria-pressed="true">
              🔊 <span data-key="on">פועל</span>
            </button>
            <button class="toggle-btn" id="sound-off" onclick="setSound(false)" aria-pressed="false">
              🔇 <span data-key="off">כבוי</span>
            </button>
          </div>
        </div>

        <!-- Read Aloud -->
        <div class="setting-item">
          <span class="setting-label" id="label-readaloud">📢 קריאה בקול</span>
          <div class="setting-options" role="group" aria-labelledby="label-readaloud">
            <button class="toggle-btn" id="tts-on" onclick="setTTS(true)" aria-pressed="false">
              ✅ <span data-key="on">פועל</span>
            </button>
            <button class="toggle-btn active" id="tts-off" onclick="setTTS(false)" aria-pressed="true">
              ❌ <span data-key="off">כבוי</span>
            </button>
          </div>
        </div>

        <!-- Questions count -->
        <div class="setting-item">
          <span class="setting-label" id="label-qcount">❓ מספר שאלות</span>
          <div class="setting-options" role="group" aria-labelledby="label-qcount">
            <button class="toggle-btn active" id="q8" onclick="setQCount(8)" aria-pressed="true">8</button>
            <button class="toggle-btn" id="q12" onclick="setQCount(12)" aria-pressed="false">12</button>
            <button class="toggle-btn" id="q16" onclick="setQCount(16)" aria-pressed="false">16</button>
          </div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="startGame()" id="btn-start" style="font-size:1.3rem;padding:20px 40px;">
          🎮 <span id="start-label">התחל לשחק!</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ========== QUIZ SCREEN ========== -->
  <div id="screen-quiz" class="screen" role="main" aria-live="polite">
    <div class="quiz-header">
      <span class="progress-text" id="progress-text">שאלה 1 מתוך 8</span>
      <span class="score-display" id="score-display">⭐ 0</span>
    </div>

    <div class="progress-bar-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-bar-role">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>

    <div class="stars-bar" id="stars-bar" aria-label="ניקוד" aria-live="polite"></div>

    <div class="card question-card">
      <div class="question-number" id="q-number"></div>
      <div style="display:flex;align-items:flex-start;gap:8px;">
        <div class="question-text" id="question-text"></div>
        <button class="read-aloud-btn" id="read-q-btn" onclick="readAloud('question')" title="קרא בקול" aria-label="קרא את השאלה בקול" style="display:none;">🔈</button>
      </div>
    </div>

    <div class="answers-grid" id="answers-grid" role="group" aria-label="תשובות"></div>

    <div class="feedback-area" id="feedback-area" role="alert">
      <span class="feedback-icon" id="feedback-icon"></span>
      <div class="feedback-text" id="feedback-text"></div>
    </div>

    <div class="next-btn-wrap" id="next-btn-wrap" style="display:none;">
      <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">
        <span id="next-label">הבא ←</span>
      </button>
    </div>
  </div>

  <!-- ========== RESULTS SCREEN ========== -->
  <div id="screen-results" class="screen" role="main">
    <div class="decorations" aria-hidden="true">🎉 🏆 🎊</div>
    <h2 id="result-title">כל הכבוד!</h2>
    <div class="card" style="align-items:center;display:flex;flex-direction:column;gap:16px;">
      <div class="result-score-text" id="result-score" aria-live="polite"></div>
      <div class="stars-bar" id="result-stars" aria-label="כוכבים שנצברו"></div>
      <p class="result-message" id="result-message"></p>
      <div class="divider"></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="startGame()">
          🔄 <span id="replay-label">שחק שוב</span>
        </button>
        <button class="btn btn-accent" onclick="shareResult()" id="share-btn">
          📋 <span id="share-label">שתף עם המשפחה</span>
        </button>
        <button class="btn btn-ghost" onclick="showHome()">
          🏠 <span id="home-label">מסך ראשי</span>
        </button>
      </div>
      <p id="copy-msg" style="color:var(--success);font-weight:700;font-size:0.95rem;display:none;"></p>
    </div>
  </div>
</div>

<script>
// =============================================
// 1. QUESTION BANK
// =============================================
const QUESTIONS = [
  {
    id: 1,
    he: { q: "מה החג שבו מתחפשים?", opts: ["פורים","פסח","שבועות","סוכות"], explanation: "פורים הוא החג שבו מתחפשים ושמחים!" },
    en: { q: "Which holiday do we dress up?", opts: ["Purim","Passover","Shavuot","Sukkot"], explanation: "Purim is the holiday when we dress up and celebrate!" },
    correct: 0
  },
  {
    id: 2,
    he: { q: "איך קוראים למגילה שקוראים בפורים?", opts: ["מגילת אסתר","מגילת רות","מגילת קהלת","מגילת איכה"], explanation: "מגילת אסתר מספרת את סיפור הנס של פורים!" },
    en: { q: "What is the scroll read on Purim?", opts: ["Megillat Esther","Megillat Ruth","Megillat Kohelet","Megillat Eicha"], explanation: "Megillat Esther tells the Purim miracle story!" },
    correct: 0
  },
  {
    id: 3,
    he: { q: "מה נותנים לחברים בפורים?", opts: ["משלוח מנות","נרות","תפוחים בדבש","מצות"], explanation: "משלוח מנות הוא מנהג לתת מתנות אוכל לחברים!" },
    en: { q: "What do we give friends on Purim?", opts: ["Mishloach Manot","Candles","Apples with honey","Matzah"], explanation: "Mishloach Manot means sending food gifts to friends!" },
    correct: 0
  },
  {
    id: 4,
    he: { q: "איך קוראים למאפה המשולש של פורים?", opts: ["אוזני המן","סופגניה","עוגת גבינה","חלה"], explanation: "אוזני המן הם עוגיות משולשות עם מילוי טעים!" },
    en: { q: "What are the triangular Purim pastries called?", opts: ["Hamantaschen","Doughnut","Cheesecake","Challah"], explanation: "Hamantaschen are triangle cookies with yummy filling!" },
    correct: 0
  },
  {
    id: 5,
    he: { q: "מה עושים כדי לשמח אנשים בפורים?", opts: ["מתחפשים ושמחים","בונים סוכה","מדליקים נרות","צמים"], explanation: "בפורים שמחים ומתחפשים ועושים שמחה לכולם!" },
    en: { q: "What do we do to make people happy on Purim?", opts: ["Dress up and celebrate","Build a sukkah","Light candles","Fast"], explanation: "On Purim we dress up and spread joy to everyone!" },
    correct: 0
  },
  {
    id: 6,
    he: { q: "איך קוראים למסיבה עם תחפושות?", opts: ["מסיבת תחפושות","מסיבת קיץ","מסיבת חורף","מסיבת יום הולדת"], explanation: "מסיבת תחפושות היא מסיבה שבה כולם לובשים תחפושות!" },
    en: { q: "What is a party where everyone wears costumes called?", opts: ["Costume party","Summer party","Winter party","Birthday party"], explanation: "A costume party is where everyone wears costumes!" },
    correct: 0
  },
  {
    id: 7,
    he: { q: "באיזה צבע יכול להיות ליצן?", opts: ["בכל הצבעים","רק שחור","רק אפור","רק לבן"], explanation: "ליצן יכול ללבוש כל צבע שהוא רוצה!" },
    en: { q: "What color can a clown be?", opts: ["Any color","Only black","Only gray","Only white"], explanation: "A clown can wear any color they want!" },
    correct: 0
  },
  {
    id: 8,
    he: { q: "מה שמים בתוך משלוח מנות?", opts: ["ממתקים וחטיפים","רק ירקות","רק מים","רק לחם"], explanation: "משלוח מנות מכיל ממתקים, חטיפים ומאכלים טעימים!" },
    en: { q: "What do we put in Mishloach Manot?", opts: ["Sweets and snacks","Only vegetables","Only water","Only bread"], explanation: "Mishloach Manot contains sweets, snacks, and tasty foods!" },
    correct: 0
  },
  {
    id: 9,
    he: { q: "מי הייתה המלכה בסיפור פורים?", opts: ["אסתר","מרים","רחל","דבורה"], explanation: "אסתר הייתה המלכה הגיבורה שהצילה את עם ישראל!" },
    en: { q: "Who was the queen in the Purim story?", opts: ["Esther","Miriam","Rachel","Deborah"], explanation: "Esther was the brave queen who saved the Jewish people!" },
    correct: 0
  },

// =============================================
// 4. UTILITY
// =============================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function t(key, ...args) {
  const val = T[state.lang][key];
  return typeof val === 'function' ? val(...args) : val;
}

// =============================================
// 5. AUDIO (simple tones via Web Audio API)
// =============================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, duration, type = 'sine', volume = 0.3) {
  if (!state.sound) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) { /* audio not supported */ }
}
function playCorrect() {
  playTone(523, 0.15); // C5
  setTimeout(() => playTone(659, 0.15), 150); // E5
  setTimeout(() => playTone(784, 0.25), 300); // G5
}
function playWrong() {
  playTone(220, 0.3, 'sawtooth', 0.2);
}
function playNext() {
  playTone(440, 0.1);
}
function playFinish() {
  [523, 587, 659, 698, 784].forEach((f, i) => setTimeout(() => playTone(f, 0.2), i * 120));
}

// =============================================
// 6. TEXT-TO-SPEECH
// =============================================
function speak(text, lang) {
  if (!state.tts || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang === 'he' ? 'he-IL' : 'en-US';
  utt.rate = 0.9;
  window.speechSynthesis.speak(utt);
}
function readAloud(part) {
  const q = state.questions[state.current];
  const lang = state.lang;
  if (part === 'question') {
    speak(q[lang].q, lang);
  }
}

// =============================================
// 10. GAME LOGIC
// =============================================
function startGame() {
  // Pick random subset
  state.questions = shuffle(QUESTIONS).slice(0, Math.min(state.qCount, QUESTIONS.length));
  state.current  = 0;
  state.score    = 0;
  state.answered = false;
  state.attempts = 0;
  state.correctFirst = false;
  updateUIStrings();
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = state.questions[state.current];
  const total = state.questions.length;
  const idx = state.current;
  const lang = state.lang;

  // Progress
  const pct = Math.round((idx / total) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-bar-role').setAttribute('aria-valuenow', pct);
  document.getElementById('progress-text').textContent = t('progressText', idx + 1, total);
  document.getElementById('score-display').textContent = `⭐ ${state.score}`;
  updateStarsBar(state.score);

  // Question
  document.getElementById('q-number').textContent = t('qNumber', idx + 1);
  document.getElementById('question-text').textContent = q[lang].q;

  // Read aloud button
  const readBtn = document.getElementById('read-q-btn');
  readBtn.style.display = state.tts ? 'inline-flex' : 'none';

  // Auto-read if TTS on
  if (state.tts) setTimeout(() => speak(q[lang].q, lang), 300);

  // Answers
  const grid = document.getElementById('answers-grid');
  grid.innerHTML = '';

  // Shuffle answer options display order but track which index is correct
  const opts = q[lang].opts.map((text, i) => ({ text, origIdx: i }));
  const shuffledOpts = shuffle(opts);

  shuffledOpts.forEach((opt, displayIdx) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt.text;
    btn.setAttribute('aria-label', opt.text);
    btn.dataset.origIdx = opt.origIdx;
    btn.onclick = () => handleAnswer(btn, opt.origIdx === q.correct, q, shuffledOpts);
    grid.appendChild(btn);
  });

  // Hide feedback & next
  hideFeedback();
  document.getElementById('next-btn-wrap').style.display = 'none';

  // Reset state
  state.answered = false;
  state.attempts = 0;
  state.correctFirst = false;
}

function handleAnswer(btn, isCorrect, q, shuffledOpts) {
  if (state.answered) return;
  state.attempts++;

  if (isCorrect) {
    state.answered = true;
    btn.classList.add('correct');
    disableAllAnswers();

    if (state.attempts === 1) {
      state.correctFirst = true;
      state.score++;
      playCorrect();
      showFeedback('correct', '✅', t('feedbackCorrect') + '\n' + getExplanation(q));
    } else {
      // Correct on second try — no star
      playCorrect();
      showFeedback('info', '💡', t('feedbackReveal', btn.textContent) + ' ' + getExplanation(q));
    }
    document.getElementById('score-display').textContent = `⭐ ${state.score}`;
    updateStarsBar(state.score);
    showNextButton();
  } else {
    btn.classList.add('wrong');
    if (state.attempts < 2) {
      // First wrong attempt — allow retry
      playWrong();
      showFeedback('wrong', '❌', t('retry'));
    } else {
      // Second wrong attempt — reveal answer
      state.answered = true;
      playWrong();
      disableAllAnswers();
      // Highlight the correct answer
      revealCorrectAnswer(q.correct, shuffledOpts);
      showFeedback('info', '💡', t('feedbackReveal', q[state.lang].opts[q.correct]) + ' ' + getExplanation(q));
      showNextButton();
    }
  }
}

function getExplanation(q) {
  const lang = state.lang;
  if (state.difficulty === 'medium') {
    return q[lang].explanation || '';
  }
  return ''; // easy: no long explanation
}

function revealCorrectAnswer(correctOrigIdx, shuffledOpts) {
  const grid = document.getElementById('answers-grid');
  const btns = grid.querySelectorAll('.answer-btn');
  btns.forEach((btn, i) => {
    if (parseInt(btn.dataset.origIdx) === correctOrigIdx) {
      btn.classList.add('revealed');
    }
  });
}

function disableAllAnswers() {
  document.querySelectorAll('.answer-btn').forEach(b => {
    b.disabled = true;
  });
}

function showFeedback(type, icon, text) {
  const area = document.getElementById('feedback-area');
  area.className = 'feedback-area show feedback-' + type;
  document.getElementById('feedback-icon').textContent = icon;
  document.getElementById('feedback-text').textContent = text;
}
function hideFeedback() {
  document.getElementById('feedback-area').className = 'feedback-area';
}

function showNextButton() {
  const wrap = document.getElementById('next-btn-wrap');
  wrap.style.display = 'flex';
  const label = document.getElementById('next-label');
  const isLast = state.current >= state.questions.length - 1;
  if (state.lang === 'he') {
    label.textContent = isLast ? 'סיום 🏁' : 'הבא ←';
  } else {
    label.textContent = isLast ? 'Finish 🏁' : 'Next →';
  }
}

function nextQuestion() {
  playNext();
  state.current++;
  if (state.current >= state.questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

    s.textContent = '⭐';
    s.style.animationDelay = (starIndex * 0.05) + 's';

// =============================================
// 14. CONFETTI
// =============================================
let confettiActive = false;
let confettiPieces = [];
let confettiRAF = null;

const CONFETTI_COLORS = ['#FF6B35','#FFD700','#7B2FBE','#2ECC71','#E74C3C','#3498DB','#FF69B4','#00CED1'];

function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  confettiActive = true;
  confettiPieces = [];

  for (let i = 0; i < 120; i++) {
    confettiPieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 12 + 6,
      h: Math.random() * 8 + 4,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 4 + 2,
      angle: Math.random() * Math.PI * 2,
      va: (Math.random() - 0.5) * 0.15,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
    });
  }

  function loop() {
    if (!confettiActive) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiPieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.angle += p.va;
      if (p.y > canvas.height + 20) {
        p.y = -20;
        p.x = Math.random() * canvas.width;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.w/2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
    confettiRAF = requestAnimationFrame(loop);
  }
  loop();

  // Stop after 6s
  setTimeout(stopConfetti, 6000);
}

function stopConfetti() {
  confettiActive = false;
  if (confettiRAF) cancelAnimationFrame(confettiRAF);
  const canvas = document.getElementById('confetti-canvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}
